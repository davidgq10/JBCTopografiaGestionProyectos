project_id = "jbc-proyectos-local"

[api]
enabled = true
port = 54321
external_url = "http://localhost:54321"
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:4173"
additional_redirect_urls = ["http://127.0.0.1:4173"]
enable_signup = false

[auth.external.azure]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_AZURE_SECRET)"
url = "env(SUPABASE_AUTH_EXTERNAL_AZURE_URL)"
redirect_uri = "http://localhost:54321/auth/v1/callback"
