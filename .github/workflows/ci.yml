name: CI

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @jbc/web exec playwright install --with-deps chromium

      - name: Run quality contract
        run: pnpm verify:ci

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jbc_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jbc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      JBC_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jbc_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm PostgreSQL client
        run: psql --version

      - name: Verify migrations and RLS
        run: pnpm verify:database

  connected:
    name: Connected integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @jbc/web exec playwright install --with-deps chromium

      - name: Verify connected vertical slice
        run: pnpm verify:connected
