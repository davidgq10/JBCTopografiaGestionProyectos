name: Dependency review

on:
  pull_request:
    branches: [Main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject high-risk dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
